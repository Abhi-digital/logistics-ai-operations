services:
  postgres:
    image: postgres:17
    container_name: routeiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routeiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - routeiq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d routeiq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  routeiq_pgdata:
